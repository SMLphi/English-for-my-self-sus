      <span class="dlg-hint">${SR_CLASS?'App đọc lời người kia, bạn nói lời của mình vào micro.'
        :'Trình duyệt này không nhận dạng giọng nói: bạn đọc to phần của mình rồi bấm Tiếp.'}</span></div>
    <div class="dlg-lines" id="rLines"></div><div id="rNow"></div>`;
  host.querySelectorAll('#rRole [data-r]').forEach(b=>b.onclick=()=>{ dlgStop(); DLG.role=+b.dataset.r; dlgRole(host,d,tid); });
  const lines=$('#rLines',host), now=$('#rNow',host);
  const isMe=k=>k%2===me;
  const logLine=(k,html)=>lines.insertAdjacentHTML('beforeend',
    dlgBubble(d,k,`<div class="dl-en${isMe(k)?' say':''}">${html}</div><div class="dl-vi">${esc(d.vi[k])}</div>`,
      isMe(k)?'me':'',isMe(k)?'Bạn':'')+'</div>');
  function next(){
    const k=R.k;
    if(k>=d.en.length) return finish();
    if(!isMe(k)){
      now.innerHTML=`<div class="role-card"><div class="role-lab">${k%2?'B':'A'} nói</div>
        <div class="dl-en big">${dlgLineHtml(d.en[k],tid,d)}</div><div class="dl-vi">${esc(d.vi[k])}</div>
        <div class="role-act"><button class="btn btn-sm" id="rRep">🔊 Nghe lại</button>
          <button class="btn btn-sm btn-primary" id="rGo">Tiếp ›</button></div></div>`;
      const adv=()=>{ if(R.k!==k) return; dlgStop(); logLine(k,dlgLineHtml(d.en[k],tid,d)); R.k++; next(); };
      const play=()=>{ const tok=++DLGSEQ; DLGPLAY.tok=tok;
        dlgSay(d,k,{onend:()=>setTimeout(()=>{ if(DLGPLAY.tok===tok) adv(); },450)}); };
      $('#rRep',now).onclick=play;
      $('#rGo',now).onclick=adv;
      play();
      return;
    }
    let got=null;
    now.innerHTML=`<div class="role-card me"><div class="role-lab">Lượt của bạn — nói câu này bằng tiếng Anh</div>
      <div class="dl-vi big">${esc(d.vi[k])}</div>
      <div class="dl-en big say" id="rEn" ${DLG.peek?'':'hidden'}>${esc(d.en[k])}</div>
      ${SR_CLASS?'<button class="mic" id="rMic" aria-label="Bấm để nói">🎙</button>':''}
      <div class="heard" id="rHeard"></div>
      <div class="role-act">
        <button class="btn btn-sm" id="rPeek" aria-pressed="${DLG.peek}">👁 ${DLG.peek?'Ẩn':'Xem'} câu gốc</button>
        <button class="btn btn-sm" id="rHear">🔊 Nghe mẫu</button>
        <button class="btn btn-sm btn-primary" id="rGo" style="margin-left:auto">${SR_CLASS?'Bỏ qua ›':'Tôi đã nói ›'}</button></div></div>`;
    const en=$('#rEn',now);
    $('#rPeek',now).onclick=e=>{ DLG.peek=!DLG.peek; en.hidden=!DLG.peek&&!got;
      e.currentTarget.innerHTML=`👁 ${DLG.peek?'Ẩn':'Xem'} câu gốc`; };
    $('#rHear',now).onclick=e=>{ dlgStop(); dlgSay(d,k,{btn:e.currentTarget}); };
    $('#rGo',now).onclick=()=>{
      if(SR_CLASS) R.sc[k]=got?got.s:0;
      logLine(k,got?sayDiffHtml(d.en[k],got.hit):esc(d.en[k])); R.k++; next();
    };
    const mic=$('#rMic',now); if(!mic) return;
    let rec=null,running=false;
    mic.onclick=()=>{
      if(running){ try{rec.stop();}catch(e){} return; }
      dlgStop();
      try{
        rec=new SR_CLASS(); rec.lang=S.dialect; rec.interimResults=false; rec.maxAlternatives=5;
        rec.onstart=()=>{running=true;mic.classList.add('rec');mic.textContent='■';$('#rHeard',now).textContent='Đang nghe…';};
        rec.onend=()=>{running=false;mic.classList.remove('rec');mic.textContent='🎙';};
        rec.onerror=ev=>{ $('#rHeard',now).textContent=ev.error==='not-allowed'||ev.error==='service-not-allowed'
          ?'Trang chưa được cấp quyền micro.':'Không nghe rõ — bấm micro nói lại.'; };
        rec.onresult=ev=>{
          const alts=[...ev.results[0]].map(r=>r.transcript), sc=sayScore(d.en[k],alts);
          if(!got||sc.s>=got.s) got=sc;
          en.hidden=false; en.innerHTML=sayDiffHtml(d.en[k],got.hit);
          $('#rHeard',now).innerHTML=`Nghe được: <b>“${esc(alts[0])}”</b> · khớp <b>${sc.s}%</b>`+
            (sc.s>=80?' 👏':' — nghe mẫu rồi nói lại');
          $('#rGo',now).textContent='Tiếp ›';
        };
        rec.start();
      }catch(e){ $('#rHeard',now).textContent='Không khởi động được micro.'; }
    };
  }
  function finish(){
    const vals=Object.values(R.sc), avg=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):null;
    if(avg!=null){ const p=DLGP[d.id]||{}; p.r=Math.max(p.r||0,avg); DLGP[d.id]=p; saveD(); }
    const list=DIALOGS[tid]||[];
    now.innerHTML=`<div class="role-card" style="text-align:center">
      <div style="font-size:40px">🎭</div><h2 style="font-size:22px;margin-top:6px">Xong vai ${me?'B':'A'}</h2>
      <p style="color:var(--muted);margin:6px 0 0">${avg!=null?`Độ khớp phát âm trung bình <b class="mono">${avg}%</b>`:'Bạn đã đọc hết phần của mình.'}</p>
      <div class="role-act" style="justify-content:center">
        <button class="btn btn-sm" id="rSwap">Đổi sang vai ${me?'A':'B'}</button>
        <button class="btn btn-sm" id="rAgain">Làm lại</button>
        ${route.i<list.length-1?'<button class="btn btn-sm btn-primary" id="rNext">Đoạn tiếp ›</button>':''}</div></div>`;
    $('#rSwap',now).onclick=()=>{ DLG.role=1-me; dlgRole(host,d,tid); };
    $('#rAgain',now).onclick=()=>dlgRole(host,d,tid);
    $('#rNext',now)?.addEventListener('click',()=>go('dialog',{t:tid,i:route.i+1}));
  }
  next();
}

/* ---- chế độ 3: điền từ còn thiếu ---- */
function dlgFill(host,d,tid){
  const blanks=[], nw=dlgNew(tid,d);
  const rows=d.en.map((s,k)=>dlgTokens(s,tid,dlgAllow(d)).map(t=>{
    if(!t.w) return esc(t.s);
    if(!nw.has(t.w.w.toLowerCase()))       // từ đã học ở đoạn trước: chỉ tô, không che
      return `<button class="dw" data-w="${esc(t.w.id)}">${esc(t.s)}</button>`;
    const n=blanks.push({ans:t.s,w:t.w})-1;
    return `<input class="gapin" data-b="${n}" aria-label="Chỗ trống ${n+1}" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:${Math.max(4,t.s.length+2)}ch">`;
  }).join(''));
  if(!blanks.length){ host.innerHTML='<div class="empty">Đoạn này không có từ mới nào để điền.</div>'; return; }
  const bank=shuffle([...new Set(blanks.map(b=>b.ans.toLowerCase()))]);
  host.innerHTML=`<div class="dlg-tools"><span class="dlg-hint">Điền ${blanks.length} chỗ trống bằng từ mới của đoạn này. Chạm từ trong ngân hàng để điền vào ô đang chọn.</span></div>
    <div class="bank" id="fBank">${bank.map(b=>`<button class="tile" data-a="${esc(b)}">${esc(b)}</button>`).join('')}</div>
    <div class="dlg-lines">${rows.map((h,k)=>dlgBubble(d,k,`<div class="dl-en">${h}</div><div class="dl-vi">${esc(d.vi[k])}</div>`)+'</div>').join('')}</div>
    <div class="role-act" style="justify-content:center;margin-top:18px">
      <button class="btn btn-primary" id="fCheck">Kiểm tra</button>
      <button class="btn" id="fReset">Làm lại</button></div>
    <div class="feedback" id="fRes"></div>`;
  const ins=[...host.querySelectorAll('.gapin')];
  let focus=ins[0];
  ins.forEach((inp,i)=>{
    inp.onfocus=()=>{focus=inp;};
    inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); (ins[i+1]||$('#fCheck',host)).focus(); } };
    inp.oninput=()=>inp.classList.remove('ok','no');
  });
  $('#fBank',host).onclick=e=>{
    const t=e.target.closest('[data-a]'); if(!t) return;
    const tgt=(focus&&!focus.value)?focus:(ins.find(x=>!x.value)||focus);
    if(!tgt) return;
    tgt.value=t.dataset.a; tgt.classList.remove('ok','no');
    const nx=ins.find(x=>!x.value); (nx||tgt).focus();
  };
  const fix=s=>String(s).toLowerCase().replace(/[’`]/g,"'").trim();
  $('#fCheck',host).onclick=()=>{
    host.querySelectorAll('.gap-fix').forEach(x=>x.remove());
    let ok=0;
    ins.forEach((inp,i)=>{
      const good=fix(inp.value)===fix(blanks[i].ans);
      inp.classList.toggle('ok',good); inp.classList.toggle('no',!good);
      if(good) ok++;
      else inp.insertAdjacentHTML('afterend',`<span class="gap-fix">${esc(blanks[i].ans)}</span>`);
    });
    const pct=Math.round(ok/blanks.length*100);
    const p=DLGP[d.id]||{}; p.f=Math.max(p.f||0,pct); DLGP[d.id]=p; saveD();
    const r=$('#fRes',host);
    r.className='feedback '+(pct>=80?'ok':'no');
    r.textContent=`Đúng ${ok}/${blanks.length} (${pct}%)`+(pct===100?' — xuất sắc!':pct>=80?' — tốt lắm':' — xem đáp án màu xanh rồi làm lại');
  };
  $('#fReset',host).onclick=()=>dlgFill(host,d,tid);
}

/* ---- phím tắt ---- */
document.addEventListener('keydown',e=>{
  if(route.v!=='study'||!SES) return;
  if(e.target.tagName==='INPUT') return;
  const g=document.querySelector('.grade');
  if(e.key===' '){const f=$('#flip');if(f){e.preventDefault();f.click();return;}}
  if(g&&/^[1-4]$/.test(e.key)){const b=g.children[+e.key-1];if(b){e.preventDefault();b.click();}}
  if(e.key.toLowerCase()==='r'){const w=SES.queue[0];if(w)speak(w.w);}
});

render();
</script>

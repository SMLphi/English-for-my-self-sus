<title>Ba Nghìn Từ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
:root{
  --ground:#EDEFEC; --surface:#FFFFFF; --surface-2:#F5F7F4; --sunk:#E4E8E3;
  --ink:#171E1B; --ink-2:#3C4642; --muted:#66716B; --faint:#8C968F;
  --line:#D9DED8; --line-2:#C6CDC5;
  --accent:#1F6F5C; --accent-ink:#14503F; --accent-soft:#DDEDE6; --on-accent:#FFFFFF;
  --chalk:#B8890E; --chalk-soft:#F7ECD2;
  --again:#B04026; --hard:#A8761B; --good:#1F6F5C; --easy:#2E6BA8;
  --again-soft:#F7E2DC; --hard-soft:#F7EDD8; --good-soft:#DDEDE6; --easy-soft:#DEE9F5;
  --shadow:0 1px 2px rgba(23,30,27,.06),0 8px 24px -12px rgba(23,30,27,.18);
  --shadow-lift:0 2px 6px rgba(23,30,27,.08),0 20px 44px -18px rgba(23,30,27,.28);
  --radius:14px;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono","Consolas",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#121614; --surface:#1B211E; --surface-2:#222925; --sunk:#0D110F;
    --ink:#E9EDE9; --ink-2:#C6CFC9; --muted:#95A09A; --faint:#6E7A74;
    --line:#2B332E; --line-2:#3A443E;
    --accent:#4FB39A; --accent-ink:#8ED6C2; --accent-soft:#1B322B; --on-accent:#0D1714; --chalk:#E0B450; --chalk-soft:#312813;
    --again:#E07A5F; --hard:#D9A441; --good:#4FB39A; --easy:#6BA3DC;
    --again-soft:#33201B; --hard-soft:#312917; --good-soft:#1B322B; --easy-soft:#1B2733;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lift:0 2px 6px rgba(0,0,0,.45),0 20px 44px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#121614; --surface:#1B211E; --surface-2:#222925; --sunk:#0D110F;
  --ink:#E9EDE9; --ink-2:#C6CFC9; --muted:#95A09A; --faint:#6E7A74;
  --line:#2B332E; --line-2:#3A443E;
  --accent:#4FB39A; --accent-ink:#8ED6C2; --accent-soft:#1B322B; --on-accent:#0D1714;
  --chalk:#E0B450; --chalk-soft:#312813;
  --again:#E07A5F; --hard:#D9A441; --good:#4FB39A; --easy:#6BA3DC;
  --again-soft:#33201B; --hard-soft:#312917; --good-soft:#1B322B; --easy-soft:#1B2733;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lift:0 2px 6px rgba(0,0,0,.45),0 20px 44px -18px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.015em}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:18px 12px;padding-top:calc(18px + env(safe-area-inset-top,0px));overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;flex:none}
.brand-name{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em;line-height:1.1}
.brand-sub{font-size:11.5px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.navbtn{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:var(--ink-2);font-weight:600;font-size:15px;text-align:left;width:100%}
.navbtn:hover{background:var(--surface-2)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
.navbtn .ico{font-size:17px;width:22px;text-align:center;flex:none}
.navbtn .badge{margin-left:auto;background:var(--chalk);color:#fff;font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:99px;font-weight:500}
:root[data-theme="dark"] .navbtn .badge,:root:not([data-theme="light"]) .navbtn .badge{color:#2A2109}
.rail-foot{margin-top:auto;padding:12px 11px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--faint)}
.main{overflow-y:auto;scroll-behavior:smooth}
.wrap{max-width:900px;margin:0 auto;padding:32px 20px 64px;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}

@media (max-width:859px){
  .shell{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .main{order:1}
  .rail{order:2;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px 6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));gap:2px;overflow-x:auto}
  .brand,.rail-foot{display:none}
  .navbtn{flex-direction:column;gap:3px;font-size:10.5px;padding:7px 4px;flex:1;align-items:center;text-align:center;letter-spacing:-.01em}
  .navbtn .ico{font-size:19px;width:auto}
  .navbtn .badge{position:absolute;margin:0;transform:translate(16px,-4px)}
  .wrap{padding:20px 16px 36px}
}

/* ---------- bits ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.eyebrow{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-h h1{font-size:clamp(26px,4.2vw,34px)}
.page-h p{margin:6px 0 0;color:var(--muted);font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 17px;border-radius:10px;font-weight:700;font-size:15px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink);transition:transform .08s ease,background .15s ease}
.btn:hover{background:var(--sunk)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn-lg{padding:14px 26px;font-size:17px;border-radius:12px}
.btn-sm{padding:6px 11px;font-size:13.5px;border-radius:8px;font-weight:600}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.pos{font-family:var(--mono);font-size:12px;color:var(--accent-ink);background:var(--accent-soft);padding:2px 7px;border-radius:5px;font-weight:500}
.ipa{font-family:var(--mono);color:var(--muted);font-size:15px}
.sep{height:1px;background:var(--line);border:0;margin:18px 0}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .big{font-size:40px;display:block;margin-bottom:10px}

/* ---------- home ---------- */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:var(--shadow);margin-bottom:20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.hero h2{font-size:clamp(22px,3.4vw,28px);margin-bottom:6px}
.hero p{margin:0;color:var(--muted)}
.hero-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.ring{--p:0;width:112px;height:112px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--sunk) 0)}
.ring::before{content:"";position:absolute;width:86px;height:86px;border-radius:50%;background:var(--surface)}
.ring>span{position:relative;text-align:center;line-height:1.15}
.ring b{font-family:var(--mono);font-size:22px;display:block;font-weight:500}
.ring small{font-size:10.5px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.ring{position:relative}
@media (max-width:640px){.hero{grid-template-columns:1fr}.ring{margin:0 auto}}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{font-family:var(--mono);font-size:26px;font-weight:500;display:block;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.due b{color:var(--chalk)}
.stat.new b{color:var(--easy)}
.stat.streak b{color:var(--again)}

/* ---------- topic grid ---------- */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:14px}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:11px;box-shadow:var(--shadow);transition:transform .1s ease,box-shadow .15s ease}
.topic:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.topic-top{display:flex;align-items:flex-start;gap:11px}
.topic-ico{font-size:26px;line-height:1;flex:none}
.topic h3{font-size:16px;line-height:1.25;font-weight:700}
.topic-meta{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-known{background:var(--accent)}
.bar .b-learn{background:var(--chalk)}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px}

/* ---------- study ---------- */
.study{max-width:660px;margin:0 auto;padding:18px 16px 40px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.study-bar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.study-bar .bar{flex:1}
.study-count{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.skillsw{display:flex;gap:3px;background:var(--sunk);border-radius:11px;padding:3px;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.skillsw button{flex:1;white-space:nowrap;padding:8px 6px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted)}
.skillsw button:hover{color:var(--ink)}
.skillsw button[aria-pressed="true"]{background:var(--surface);color:var(--accent-ink);box-shadow:var(--shadow)}
.quick{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.quick .row{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.mode-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-soft);padding:4px 10px;border-radius:99px}

.fc{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lift);padding:26px 24px;min-height:330px;display:flex;flex-direction:column}
.fc-pic{font-size:60px;line-height:1;text-align:center;margin-bottom:14px}
.photo{position:relative;display:inline-grid;place-items:center;line-height:1;border-radius:14px;
  overflow:hidden;border:1px solid var(--line);background:var(--surface-2);max-width:100%}
.ph-fb{grid-area:1/1;z-index:0}
.ph-img{grid-area:1/1;z-index:1;width:100%;height:100%;background-repeat:no-repeat}
.fc-pic img{width:150px;height:150px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.fc-word{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,42px);text-align:center;line-height:1.1;letter-spacing:-.02em;word-break:break-word}
.fc-sub{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:9px}
.fc-vi{font-size:20px;text-align:center;color:var(--accent-ink);font-weight:700;margin-top:4px}
.fc-body{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line-2);display:flex;flex-direction:column;gap:13px}
.fc-ex{font-size:16px;line-height:1.55}
.fc-ex .en{font-weight:600}
.fc-ex .vi{color:var(--muted);font-size:14.5px;display:block;margin-top:2px}
.fc-ex .src{display:block;margin-top:3px;font-size:11px;color:var(--faint);letter-spacing:.01em}
.kv{font-size:14px;color:var(--muted)}
.kv b{color:var(--ink-2);font-weight:700}
.hook{background:var(--chalk-soft);border-left:3px solid var(--chalk);border-radius:0 9px 9px 0;padding:10px 13px;font-size:14.5px;line-height:1.5}
.hook b{color:var(--chalk);font-weight:700;letter-spacing:.04em;font-size:11.5px;text-transform:uppercase;display:block;margin-bottom:3px}
.speak-btn{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:19px;flex:none;border:1px solid transparent}
.speak-btn:hover{background:var(--accent);color:var(--on-accent)}
.speak-btn.playing{animation:pulse 1s ease infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.grade button{padding:12px 4px;border-radius:11px;font-weight:700;font-size:14px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.grade small{font-family:var(--mono);font-size:10.5px;font-weight:400;opacity:.8}
.g-again{background:var(--again-soft);color:var(--again)}
.g-hard{background:var(--hard-soft);color:var(--hard)}
.g-good{background:var(--good-soft);color:var(--good)}
.g-easy{background:var(--easy-soft);color:var(--easy)}
.grade button:hover{filter:brightness(.96)}

.opts{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.opt{text-align:left;padding:13px 15px;border-radius:11px;background:var(--surface-2);border:1.5px solid var(--line);font-size:15.5px;font-weight:600;display:flex;gap:10px;align-items:center}
.opt:hover{border-color:var(--line-2);background:var(--sunk)}
.opt .n{font-family:var(--mono);font-size:12px;color:var(--faint);width:16px;flex:none}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--again-soft);border-color:var(--again);color:var(--again)}
.opt[disabled]{pointer-events:none}

.write-in{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface-2);font-size:19px;font-family:var(--mono);text-align:center;letter-spacing:.02em}
.write-in:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.write-in.ok{border-color:var(--good);color:var(--good)}
.write-in.no{border-color:var(--again);color:var(--again)}
.diff{font-family:var(--mono);font-size:22px;text-align:center;letter-spacing:.12em;margin-top:12px}
.diff .ok{color:var(--good)}
.diff .no{color:var(--again);text-decoration:underline wavy}
.diff .miss{color:var(--faint)}
.blank{font-family:var(--mono);color:var(--accent);border-bottom:2px solid var(--accent);padding:0 3px}
.feedback{text-align:center;font-weight:700;margin-top:12px;font-size:15px}
.feedback.ok{color:var(--good)}
.feedback.no{color:var(--again)}
.mic{width:96px;height:96px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:38px;display:grid;place-items:center;margin:8px auto;box-shadow:var(--shadow-lift)}
.mic.rec{background:var(--again);animation:pulse .9s ease infinite}
.heard{text-align:center;font-family:var(--mono);font-size:16px;margin-top:12px;color:var(--muted);min-height:24px}

/* ---------- ngữ pháp ---------- */
.lvl{font-family:var(--mono);font-size:10.5px;font-weight:500;padding:2px 6px;border-radius:5px;background:var(--sunk);color:var(--muted)}
.lvl.A1,.lvl.A2{background:var(--good-soft);color:var(--good)}
.lvl.B1,.lvl.B2{background:var(--easy-soft);color:var(--easy)}
.lvl.C1{background:var(--hard-soft);color:var(--hard)}
.gr-group{margin-bottom:26px}
.gr-group h2{font-size:18px;display:flex;align-items:center;gap:9px;margin-bottom:11px}
.gr-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:10px}
.gr-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;text-align:left;display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow)}
.gr-item:hover{border-color:var(--line-2);transform:translateY(-1px)}
.gr-item .top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.gr-item h3{font-size:15px;line-height:1.3}
.gr-item .en{font-size:12.5px;color:var(--faint);font-family:var(--mono)}
.gr-forms{width:100%;border-collapse:collapse;font-size:14.5px;margin:4px 0}
.gr-forms td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.gr-forms tr:last-child td{border-bottom:0}
.gr-forms td:first-child{color:var(--muted);white-space:nowrap;width:1%;font-size:13.5px}
.gr-forms td:nth-child(2){font-family:var(--mono);font-size:13.5px;color:var(--accent-ink)}
.gr-forms td:last-child{font-style:italic}
.gr-sec{margin-top:18px}
.gr-sec .eyebrow{margin-bottom:8px}
.gr-note{font-size:14.5px;line-height:1.55;padding-left:18px;margin:0}
.gr-note li{margin-bottom:5px}
.gr-trap{background:var(--again-soft);border-radius:10px;padding:11px 13px;font-size:14.5px;margin-bottom:8px}
.gr-trap .no{color:var(--again);text-decoration:line-through}
.gr-trap .yes{color:var(--good);font-weight:700}
.gr-trap .why{color:var(--muted);font-size:13.5px;display:block;margin-top:4px}
.tiles{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:14px}
.tile{padding:9px 13px;border-radius:9px;background:var(--surface-2);border:1.5px solid var(--line-2);font-size:15.5px;font-weight:600}
.tile:hover{background:var(--sunk)}
.tile.used{opacity:.28;pointer-events:none}
.slot{min-height:52px;border:1.5px dashed var(--line-2);border-radius:11px;padding:8px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;justify-content:center;background:var(--surface-2)}
.slot:empty::before{content:"Chạm vào các mảnh bên dưới để ghép câu";color:var(--faint);font-size:13.5px}
.q-text{font-size:19px;line-height:1.6;text-align:center;font-weight:600}
.q-text .gap{font-family:var(--mono);color:var(--accent);border-bottom:2px solid var(--accent);padding:0 8px}
.q-hint{font-family:var(--mono);font-size:14px;color:var(--muted);text-align:center;margin-top:6px}
.why-box{background:var(--accent-soft);border-radius:10px;padding:11px 13px;font-size:14.5px;margin-top:12px;line-height:1.5}
.why-box b{color:var(--accent-ink);display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}

/* ---------- browse ---------- */
.search{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search input,.search select{padding:10px 13px;border-radius:10px;border:1.5px solid var(--line-2);background:var(--surface);font-size:15px}
.search input{flex:1;min-width:180px}
.search input:focus,.search select:focus{border-color:var(--accent);outline:none}
.wlist{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.wrow{background:var(--surface);padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%}
.wrow:hover{background:var(--surface-2)}
.wrow .ic{font-size:22px}
.wrow .w{font-weight:700;font-size:16px}
.wrow .m{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>
const DATA = /*__DATA__*/ null;

/* ============================================================
   0. Tiện ích
   ============================================================ */
const $ = (s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAY=86400000;
const today=()=>Math.floor(new Date().setHours(0,0,0,0)/DAY);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();

function toast(msg){
  const t=el('div','toast',esc(msg));document.body.appendChild(t);
  setTimeout(()=>t.remove(),2200);
}

/* ---- từ điển phẳng ---- */
const OX=DATA.ox||{};      // nhan trinh do CEFR chinh thuc cua Oxford 3000
const WORDS=[];            // {id,t,w,pos,ipa,vi,forms,ex,exvi,syn,pic,hook,cefr}
const BY_ID=new Map();
const TOPICS=DATA.topics;
TOPICS.forEach(tp=>{
  tp.words.forEach((a,i)=>{
    const o={id:tp.id+':'+a[0],t:tp.id,g:tp.group,w:a[0],pos:a[1],ipa:a[2],vi:a[3],forms:a[4],
             ex:a[5],exvi:a[6],syn:a[7],pic:a[8]||tp.icon,hook:a[9]||'',
             ex2:a[10]||'',ex2vi:a[11]||'',ex2src:a[12]||'',cefr:OX[a[0].toLowerCase().replace(/[‘’]/g,"'").replace(/\s+/g,' ')]||''};
    WORDS.push(o);BY_ID.set(o.id,o);
  });
});
const TOPIC_BY_ID=new Map(TOPICS.map(t=>[t.id,t]));
// Chủ đề lớn (40) chia thành chủ đề con nhỏ theo nghĩa để dễ học, dễ tập trung.
// kind: 'theme' = chủ đề đời sống (t01–t18), 'level' = từ loại & cấp độ (t19–t40)
const GROUPS=DATA.groups||[];
const GROUP_BY_ID=new Map(GROUPS.map(g=>[g.id,g]));
const lessonTitle=tp=>{ const g=GROUP_BY_ID.get(tp.group); return g&&g.kind==='level'?g.name+' · '+tp.name:tp.name; };
const PHOTOS=DATA.photos||{};
const GRAMMAR=DATA.grammar||[];
const GPOINTS=[]; GRAMMAR.forEach(g=>g.points.forEach(p=>{p.group=g.group;p.gicon=g.icon;GPOINTS.push(p);}));
const GP_BY_ID=new Map(GPOINTS.map(p=>[p.id,p]));
const gid=id=>'G:'+id;
// nguon cua cau vi du thu hai: cau tieng Anh luon lay tu kho Tatoeba (CC BY 2.0 FR)
function srcLabel(s){
  if(s==='V') return 'Câu: kho Tatoeba (CC BY 2.0 FR) · bản dịch đã đối chiếu';
  if(s==='C') return 'Câu: kho Tatoeba (CC BY 2.0 FR) · bản dịch của app';
  if(s==='T') return 'Câu &amp; bản dịch: kho Tatoeba (CC BY 2.0 FR) — chưa đối chiếu';
  if(s==='M') return 'Câu do app biên soạn';
  return '';
}
function photoCss(w){
  const b=PHOTOS[w.t]; if(!b) return null;
  const i=b.cells[w.w]; if(i==null) return null;
  const col=i%b.cols, row=(i/b.cols)|0;
  const x=b.cols>1?col*100/(b.cols-1):0, y=b.rows>1?row*100/(b.rows-1):0;
  return `background-image:url(img/${w.t}.jpg);`
       + `background-size:${b.cols*100}% ${b.rows*100}%;background-position:${x}% ${y}%`;
}
// Bieu tuong nam o lop duoi. Anh JPEG dac nen phu kin khi tai duoc;
// neu anh hong thi lop tren trong suot va bieu tuong hien ra.
function photoBox(w,size){
  const css=photoCss(w); if(!css) return null;
  return `<span class="photo" style="width:${size}px;height:${size}px;font-size:${Math.round(size*0.42)}px">`
       + `<span class="ph-fb">${w.pic}</span><span class="ph-img" style="${css}"></span></span>`;
}
function photoTitle(w){ return (PHOTOS[w.t]&&PHOTOS[w.t].titles[w.w])||''; }

/* ============================================================
   1. Lưu trữ: localStorage + đồng bộ đám mây (nếu có)
   ============================================================ */
const LS_P='bnt.progress.v1', LS_S='bnt.settings.v1', LS_L='bnt.log.v1';
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

const S = Object.assign({
  voice:'', voiceB:'', rate:0.92, dialect:'en-US', goalNew:12, goalRev:60,
  theme:'system', mode:'auto', autoPlay:true, showHook:true
}, lsGet(LS_S,{}));
function saveS(){lsSet(LS_S,S);}

/* P[id] = {r:reps, i:interval, e:ease, d:dueDay, l:lapses, n:attempts, c:correct, t:lastTs,
            k:{read,listen,speak,write} số lần đúng theo kỹ năng} */
let P = lsGet(LS_P,{});
// Tiến độ lưu theo "mã chủ đề:từ". Khi chia lại chủ đề, đổi khoá sang bài mới chứa đúng từ đó.
const W2ID=new Map(WORDS.map(w=>[w.w.toLowerCase(),w.id]));
function migrateProgress(src){
  let moved=0;
  for(const k of Object.keys(src)){
    if(k.startsWith('G:')||BY_ID.has(k)) continue;
    const i=k.indexOf(':'); if(i<0) continue;
    const w=k.slice(i+1).toLowerCase(), pre=k.slice(0,i);
    // từ có ở nhiều chủ đề (tired: Cảm xúc & Sức khỏe) -> ưu tiên đúng chủ đề lớn cũ (t04:tired -> t04x:tired)
    const same=WORDS.find(x=>x.g===pre&&x.w.toLowerCase()===w);
    const nid=(same&&same.id)||W2ID.get(w)||W2ID.get(w.replace(/s$/,''));
    if(!nid) continue;
    if(!src[nid]||(src[k].t||0)>(src[nid].t||0)) src[nid]=src[k];
    delete src[k]; moved++;
  }
  return moved;
}
if(migrateProgress(P)) lsSet(LS_P,P);
let LOG = lsGet(LS_L,{});     // {dayNum:{n:newCount, r:reviewCount, c:correct, a:attempts}}
const dirty=new Set();
let saveTimer=null;
function saveP(id){
  if(id) dirty.add(id);
  lsSet(LS_P,P); lsSet(LS_L,LOG);
  clearTimeout(saveTimer); saveTimer=setTimeout(cloudPush,4000);
}

/* ---- đồng bộ qua capability db ---- */
let DB=null, cloudState='off';
(async()=>{
  try{
    const db = await window.claude?.use?.('db');
    if(!db) return;
    DB=db; cloudState='on';
    const doc = await db.doc('progress/main').get().catch(()=>null);
    const rem = doc && doc.data ? doc.data : null;
    if(rem && rem.P){
      let merged=0;
      migrateProgress(rem.P);
      for(const [k,v] of Object.entries(rem.P)){
        if(!P[k] || (v.t||0) > (P[k].t||0)){P[k]=v;merged++;}
      }
      for(const [d,v] of Object.entries(rem.LOG||{})) if(!LOG[d]) LOG[d]=v;
      if(merged){lsSet(LS_P,P);lsSet(LS_L,LOG);render();toast('Đã tải tiến độ từ thiết bị khác');}
    }
    updateFoot();
  }catch(e){cloudState='off';}
})();
async function cloudPush(){
  if(!DB) return;
  try{ await DB.doc('progress/main').set({P,LOG,at:Date.now()}); cloudState='on'; }
  catch(e){ cloudState='err'; }
  updateFoot();
}

/* ---- ảnh người dùng dán vào (IndexedDB) ---- */
const IMG={db:null,cache:new Map()};
IMG.open=()=>new Promise(res=>{
  if(IMG.db) return res(IMG.db);
  try{
    const r=indexedDB.open('bnt-img',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('img');
    r.onsuccess=()=>{IMG.db=r.result;res(IMG.db);};
    r.onerror=()=>res(null);
  }catch(e){res(null);}
});
IMG.get=async id=>{
  if(IMG.cache.has(id)) return IMG.cache.get(id);
  const db=await IMG.open(); if(!db) return null;
  return new Promise(res=>{
    try{
      const rq=db.transaction('img').objectStore('img').get(id);
      rq.onsuccess=()=>{const v=rq.result||null;IMG.cache.set(id,v);res(v);};
      rq.onerror=()=>res(null);
    }catch(e){res(null);}
  });
};
IMG.put=async(id,dataUrl)=>{
  const db=await IMG.open(); if(!db) return;
  try{db.transaction('img','readwrite').objectStore('img').put(dataUrl,id);IMG.cache.set(id,dataUrl);}catch(e){}
};
IMG.del=async id=>{
  const db=await IMG.open(); if(!db) return;
  try{db.transaction('img','readwrite').objectStore('img').delete(id);IMG.cache.delete(id);}catch(e){}
};
function fileToDataUrl(file,max=480){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const s=Math.min(1,max/Math.max(im.width,im.height));
        const c=el('canvas');c.width=im.width*s|0;c.height=im.height*s|0;
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',.82));
      };
      im.onerror=()=>res(null); im.src=fr.result;
    };
    fr.onerror=()=>res(null); fr.readAsDataURL(file);
  });
}

/* ============================================================
   2. Lặp lại ngắt quãng kiểu Anki
   - Từ mới / từ quên: học theo các bước tính bằng PHÚT, quay lại ngay trong phiên
   - Đã thuộc: ôn theo NGÀY, luôn giữ Khó < Tốt < Dễ
   ============================================================ */
const BLANK=()=>({r:0,i:0,e:2.5,d:0,l:0,n:0,c:0,t:0,s:0,st:0,due:0,k:{read:0,listen:0,speak:0,write:0}});
const LEARN_STEPS=[1,10];        // phút — bước học từ mới
const RELEARN_STEPS=[10];        // phút — học lại từ vừa quên
const GRAD_IV=1, EASY_IV=4;      // ngày — khi "tốt nghiệp" bước học
const MIN=60000;
const prog=id=>P[id];
const isNew=id=>!P[id];
// trạng thái: 0 mới · 1 đang học · 2 ôn · 3 học lại (dữ liệu cũ không có s thì suy ra)
const srsState=p=>!p?0:(p.s!=null?p.s:(p.r>0?2:1));
const isDue=id=>{ const p=P[id]; if(!p) return false; return p.due?p.due<=Date.now():p.d<=today(); };
const isKnown=id=>P[id] && P[id].i>=21;
const isLearning=id=>P[id] && P[id].i<21;

// Tính lịch cho một lần chấm, KHÔNG sửa p. Trả về {s,st,i,e,mins}
function schedule(p,q,daysOnly){
  const s=srsState(p), e=p?p.e:2.5, i=p?p.i:0, st=p&&p.st||0;
  const out={s,st,i,e,mins:0};
  const ivs=base=>{  // Khó / Tốt / Dễ cho thẻ đang ôn — luôn tăng dần
    const hard=Math.max(base+1,Math.round(base*1.2));
    const good=Math.max(hard+1,Math.round(base*e));
    return [hard,good,Math.max(good+1,Math.round(base*e*1.3))];
  };
  if(daysOnly){                       // ngữ pháp: chấm theo cả bài, chỉ tính ngày
    if(q<3){ Object.assign(out,{s:1,i:0,e:Math.max(1.3,e-0.2)}); return out; }
    out.i=(s===2&&i>0?ivs(i):[1,3,5])[q-3]; out.s=2;
    out.e=Math.max(1.3,e+[-0.15,0,0.15][q-3]); return out;
  }
  if(s===2){                          // thẻ đang ôn theo ngày
    if(q<3){ Object.assign(out,{s:3,st:0,e:Math.max(1.3,e-0.2),i:1,mins:RELEARN_STEPS[0]}); return out; }   // quên -> học lại, xong thì ôn sau 1 ngày
    out.i=ivs(Math.max(1,i))[q-3]; out.e=Math.max(1.3,e+[-0.15,0,0.15][q-3]); return out;
  }
  const steps=s===3?RELEARN_STEPS:LEARN_STEPS, learnS=s===3?3:1;
  if(q<3){ Object.assign(out,{s:learnS,st:0,mins:steps[0]}); return out; }
  if(q===5){ Object.assign(out,{s:2,st:0,i:s===3?Math.max(i+1,EASY_IV):EASY_IV}); return out; }
  if(q===3){                          // Khó: ở lại bước hiện tại (bước đầu: trung bình 2 bước đầu; chỉ 1 bước: ×1,5)
    const m=st===0&&steps.length>1?Math.round((steps[0]+steps[1])/2)
      :steps.length===1?Math.round(steps[0]*1.5):steps[Math.min(st,steps.length-1)];
    Object.assign(out,{s:learnS,mins:Math.max(m,steps[0]+1)}); return out;
  }
  const nx=st+1;                      // Tốt: sang bước sau, hết bước thì tốt nghiệp
  if(nx>=steps.length){ Object.assign(out,{s:2,st:0,i:s===3?Math.max(1,i):GRAD_IV}); return out; }
  Object.assign(out,{s:learnS,st:nx,mins:steps[nx]}); return out;
}

function grade(id,q,skill,daysOnly){
  const p = P[id] || (P[id]=BLANK());
  const d0=today(), was=srsState(p);
  const r=schedule(p,q,daysOnly);
  p.n++; if(q>=3) p.c++;
  if(skill && p.k && q>=3) p.k[skill]=(p.k[skill]||0)+1;
  if(was===2&&q<3){ p.l++; p.r=0; }        // quên một từ đã thuộc
  else if(q>=3&&r.s===2) p.r++;
  p.s=r.s; p.st=r.st; p.e=r.e; p.i=r.i;
  if(r.mins){ p.due=Date.now()+r.mins*MIN; p.d=d0; }
  else{ p.due=0; p.d=d0+p.i; }
  p.t=Date.now();
  const L=LOG[d0]||(LOG[d0]={n:0,r:0,c:0,a:0});
  L.a++; if(q>=3) L.c++;
  if(was===0) L.n++; else L.r++;
  saveP(id);
  return p;
}
const fmtIv=(mins,days)=>mins?(mins<60?mins+' phút':Math.round(mins/60)+' giờ')
  :days<=1?'1 ngày':days<30?days+' ngày':days<365?(days/30).toFixed(1).replace('.0','')+' tháng':(days/365).toFixed(1).replace('.0','')+' năm';
function nextLabel(id,q){ const r=schedule(P[id],q); return fmtIv(r.mins,r.i); }

function streak(){
  let d=today(), n=0;
  if(!LOG[d]) d--;                       // hôm nay chưa học thì tính từ hôm qua
  while(LOG[d] && LOG[d].a>0){n++;d--;}
  return n;
}

// Xep hang giong: uu tien giong tong hop the he moi (Natural/Neural/Google)
// vi chung nghe gan nguoi that hon han giong co ban cua Windows.
// iPhone/Mac: Safari đưa ra cả giọng "vui nhộn" và giọng máy kiểu cũ (Albert, Bad News, Zarvox,
// Eddy, Flo, Grandma...) cũng gắn nhãn en-US -> loại hẳn, kẻo app chọn nhầm vì đứng đầu vần.
const NOVELTY=/\b(albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|junior|kathy|organ|superstar|trinoids|whisper|wobble|zarvox|ralph|fred|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley)\b/i;
// giọng người thật của Apple (bản thường đã khá rõ; bản Nâng cao / Cao cấp tốt hơn nhiều)
const APPLE_GOOD=/\b(samantha|ava|allison|susan|tom|alex|evan|nathan|zoe|nicky|joelle|noelle|aaron|daniel|kate|serena|arthur|martha|karen|moira|tessa|fiona|rishi|veena|catherine|gordon|lee|oliver|jamie|matilda)\b/i;
function voiceScore(v){
  const n=(v.name||'')+' '+(v.voiceURI||'');
  let s=0;
  if(NOVELTY.test(v.name||''))             return -100;
  if(/natural|neural/i.test(n))            s+=60;
  else if(/premium/i.test(n))              s+=55;
  else if(/google/i.test(n))               s+=50;
  else if(/enhanced|siri/i.test(n))        s+=45;
  else if(/online/i.test(n))               s+=20;
  if(APPLE_GOOD.test(v.name||''))          s+=25;
  if(v.localService===false)               s+=10;
  const want=S.dialect==='en-GB'?/en[-_]GB/i:/en[-_]US/i;
  if(want.test(v.lang)) s+=30; else if(/^en/i.test(v.lang)) s+=10;
  return s;
}
function voiceTag(v){
  const n=(v.name||'');
  if(/natural|neural/i.test(n)) return 'tự nhiên nhất';
  if(/google/i.test(n))         return 'rất tự nhiên';
  const u=n+' '+(v.voiceURI||'');
  if(/premium/i.test(u))  return 'cao cấp';
  if(/enhanced/i.test(u)) return 'nâng cao';
  if(NOVELTY.test(n))     return 'giọng vui nhộn — không nên dùng';
  if(APPLE_GOOD.test(n))  return 'giọng chuẩn';
  return 'giọng cơ bản';
}
function rankedVoices(){ return [...TTS.voices].sort((a,b)=>voiceScore(b)-voiceScore(a)); }
// iPhone/iPad: Safari chỉ cho trang web thấy các giọng cài sẵn; giọng tải thêm (vd Allison Nâng cao)
// không có trong danh sách. Nhưng nếu KHÔNG chỉ định giọng mà chỉ báo ngôn ngữ, iOS đọc bằng giọng mặc định
// người dùng chọn ở Cài đặt → Trợ năng → Nội dung được đọc → Giọng nói → Tiếng Anh.
const isIOS=()=>{ const ua=navigator.userAgent||''; return /iPhone|iPad|iPod/i.test(ua)||(/Macintosh/.test(ua)&&(navigator.maxTouchPoints||0)>1); };
const SYSTEM_VOICE='__system__';
const useSystemVoice=()=>S.voice===SYSTEM_VOICE||(!S.voice&&isIOS());
function pickVoice(){
  if(useSystemVoice()) return null;              // null = để hệ điều hành chọn giọng mặc định
  if(!TTS.voices.length) return null;
  if(S.voice){const v=TTS.voices.find(x=>x.voiceURI===S.voice); if(v) return v;}
  return rankedVoices()[0]||null;
}
let speakBtnEl=null;
// Nghe lại đúng câu vừa đọc (trong 20 giây) thì đọc chậm, bấm lần nữa lại đọc thường — như Google Dịch.
// Chuỗi đọc liền nhiều câu (có onend) thì luôn đọc tốc độ thường.
// Nhớ riêng từng từ/câu: nghe câu ví dụ xen giữa không làm mất lượt "nghe chậm" của từ.
const TTS_HIST=new Map();                        // text -> {t, slow}
// Chậm còn khoảng một nửa (iPhone nén chênh lệch tốc độ nên cần giảm mạnh mới nghe rõ khác biệt)
const slowRate=()=>Math.max(0.3,Math.round(S.rate*0.5*100)/100);
// Đọc chậm câu dài: tách thành cụm 2–3 từ, mỗi cụm một lượt đọc -> có quãng nghỉ giữa các cụm.
// Nhờ vậy vẫn nghe rõ là chậm cả khi máy bỏ qua tốc độ. Không để cụm kết thúc bằng mạo từ/giới từ ("the | meeting").
const GLUE=/^(a|an|the|to|of|in|on|at|for|with|from|by|and|or|but|my|your|his|her|its|our|their|this|that|some|is|are|was|were|be|i|you|he|she|we|they|it|not|don't|can't|very)$/i;
function slowChunks(text){
  const out=[];
  String(text).replace(/([,.;:!?])\s+/g,'$1\n').split('\n').forEach(cl=>{
    const ws=cl.trim().split(/\s+/).filter(Boolean);
    for(let i=0;i<ws.length;){
      let n=Math.min(3,ws.length-i);
      while(i+n<ws.length&&n<4&&GLUE.test(ws[i+n-1].replace(/[^\w']/g,''))) n++;
      if(ws.length-(i+n)===1) n++;                 // không để một từ lẻ loi cuối câu
      out.push(ws.slice(i,i+n).join(' ')); i+=n;
    }
  });
  return out.length?out:[String(text)];
}
// iPhone đang dùng giọng mặc định (không chỉ định giọng): iOS đọc theo tốc độ trong Trợ năng và bỏ qua tốc độ
// của app, nên nghe chậm không khác gì. Khi đọc chậm thì mượn giọng Apple có sẵn tốt nhất — giọng này theo đúng tốc độ.
function slowVoice(){
  if(!(useSystemVoice()&&isIOS())) return null;
  return rankedVoices().find(v=>voiceScore(v)>0&&v.lang.replace('_','-').startsWith(S.dialect))||rankedVoices().find(v=>voiceScore(v)>0)||null;
}
function speak(text,opts={}){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    let slow=!!opts.slow;
    if(!slow&&!opts.onend&&!opts.rate){
      const h=TTS_HIST.get(text), now=Date.now();
      slow=h&&now-h.t<30000?!h.slow:false;
      TTS_HIST.set(text,{t:now,slow});
      if(TTS_HIST.size>200) TTS_HIST.delete(TTS_HIST.keys().next().value);
      if(slow&&!opts.quiet) toast('🐢 Đọc chậm — bấm lần nữa để về tốc độ thường');
    }
    const v=opts.voice||(slow&&slowVoice())||pickVoice();
    const parts=slow?slowChunks(text):[text];
    if(opts.btn){ opts.btn.classList.add('playing'); opts.btn.classList.toggle('slow',slow); }
    parts.forEach((p,i)=>{
      const u=new SpeechSynthesisUtterance(p);
      if(v){u.voice=v;u.lang=v.lang;} else u.lang=S.dialect;
      u.rate=opts.rate||(slow?slowRate():S.rate); u.pitch=opts.pitch||1;
      if(i===parts.length-1) u.onend=u.onerror=()=>{ if(opts.btn) opts.btn.classList.remove('playing'); if(opts.onend) opts.onend(); };
      speechSynthesis.speak(u);
    });
  }catch(e){}
}
function voiceProblem(){
  if(!('speechSynthesis' in window)) return {lvl:2,msg:'Trình duyệt này không có chức năng đọc. Hãy dùng Chrome, Edge hoặc Safari.'};
  if(useSystemVoice()) return null;              // dùng giọng mặc định người dùng đã chọn trong máy
  const v=pickVoice();
  if(!v) return {lvl:2,msg:'Máy chưa có giọng tiếng Anh nào, nên trình duyệt có thể đọc bằng giọng tiếng Việt, sai hoàn toàn phát âm.'};
  if(voiceScore(v)<50) return {lvl:1,msg:'Đang dùng giọng cơ bản “'+v.name+'”: đúng phát âm nhưng nghe như máy.'};
  return null;
}

/* ---------- Phân trang dùng chung ---------- */
const PAGES={};   // key -> trang đang xem; nhớ lại khi quay về danh sách
function paginate(host,key,items,size,drawItem,opts={}){
  const n=Math.max(1,Math.ceil(items.length/size));
  let p=Math.max(0,Math.min(PAGES[key]||0,n-1));
  const box=el('div',opts.cls||''), nav=el('nav','pager');
  nav.setAttribute('aria-label','Phân trang');
  host.appendChild(box); host.appendChild(nav);
  const draw=scroll=>{
    PAGES[key]=p; box.innerHTML='';
    items.slice(p*size,(p+1)*size).forEach((it,i)=>{ const e=drawItem(it,p*size+i); if(e) box.appendChild(e); });
    nav.hidden=n<=1;
    nav.innerHTML=pagerHtml(p,n,items.length,size,opts.unit||'mục');
    nav.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ p=+b.dataset.p; draw(true); });
    if(scroll){ try{ (opts.top||box).scrollIntoView({block:'start',behavior:'smooth'}); }catch(e){} }
  };
  draw(false);
}
function pagerHtml(p,n,total,size,unit){
  const nums=[];                                   // 1 … 4 5 6 … 12
  for(let i=0;i<n;i++){
    if(i===0||i===n-1||Math.abs(i-p)<=1) nums.push(i);
    else if(nums[nums.length-1]!=='…') nums.push('…');
  }
  const from=p*size+1, to=Math.min(total,(p+1)*size);
  return `<button class="pg" data-p="${p-1}" ${p?'':'disabled'} aria-label="Trang trước">‹</button>
    ${nums.map(i=>i==='…'?'<span class="pg-gap">…</span>'
      :`<button class="pg${i===p?' on':''}" data-p="${i}"${i===p?' aria-current="page"':''}>${i+1}</button>`).join('')}
    <button class="pg" data-p="${p+1}" ${p<n-1?'':'disabled'} aria-label="Trang sau">›</button>
    <span class="pg-info mono">${from}–${to} / ${total} ${unit}</span>`;
}

function topicStat(tp){
  let nw=0,learn=0,known=0,due=0;
  for(const a of tp.words){
    const id=tp.id+':'+a[0];
    if(isNew(id)) nw++;
    else{ if(isDue(id)) due++; if(isKnown(id)) known++; else learn++; }
  }
  return {tp,nw,learn,known,due,total:tp.words.length,seen:tp.words.length-nw};
}
function topicCard(ts,short){
  const {tp}=ts;
  const b=el('div','topic'); b.tabIndex=0; b.setAttribute('role','button');
  b.innerHTML=`
    <div class="topic-top"><span class="topic-ico">${tp.icon}</span>
      <div style="min-width:0"><h3>${esc(short?tp.name:lessonTitle(tp))}</h3>
        <div class="topic-meta">${tp.level?`<span class="lvl-r">${esc(tp.level)}</span> · `:''}${ts.known}/${ts.total} thuộc${ts.due?` · <span style="color:var(--chalk)">${ts.due} tới hạn</span>`:''}</div>
      </div></div>
    <div class="bar"><i class="b-known" style="width:${ts.known/ts.total*100}%"></i><i class="b-learn" style="width:${ts.learn/ts.total*100}%"></i></div>`;
  b.onclick=()=>startSession(tp.id);
  b.onkeydown=e=>{ if((e.key==='Enter'||e.key===' ')&&e.target===b){ e.preventDefault(); startSession(tp.id); } };
  return b;
}

let browseQ='',browseT='all',browseS='all',browseO='all';
function viewBrowse(root){
  root.innerHTML=`<div class="page-h"><div><h1>Tra từ</h1><p>Tìm trong ${WORDS.length} từ.</p></div></div>
    <div class="search">
      <input id="q" type="search" placeholder="Gõ từ tiếng Anh hoặc nghĩa tiếng Việt…" value="${esc(browseQ)}">
      <select id="ft"><option value="all">Mọi chủ đề</option>${GROUPS.map(g=>`<option value="${g.id}"${browseT===g.id?' selected':''}>${esc(g.name)}</option>`).join('')}</select>
      <select id="fo"><option value="all">Mọi nguồn</option><option value="ox">Chỉ Oxford 3000</option><option value="A1">Oxford A1</option><option value="A2">Oxford A2</option><option value="B1">Oxford B1</option><option value="B2">Oxford B2</option><option value="ext">Từ mở rộng</option></select>
      <select id="fs"><option value="all">Mọi trạng thái</option><option value="new"${browseS==='new'?' selected':''}>Chưa học</option><option value="learn"${browseS==='learn'?' selected':''}>Đang học</option><option value="known"${browseS==='known'?' selected':''}>Đã thuộc</option><option value="due"${browseS==='due'?' selected':''}>Tới hạn</option></select>
    </div><div id="res"></div>`;
  const draw=()=>{
    const q=norm(browseQ);
    const list=WORDS.filter(w=>{
      if(browseT!=='all'&&w.g!==browseT) return false;
      if(browseO==='ox'&&!w.cefr) return false;
      if(browseO==='ext'&&w.cefr) return false;
      if(['A1','A2','B1','B2'].includes(browseO)&&w.cefr!==browseO) return false;
      if(browseS==='new'&&!isNew(w.id)) return false;
      if(browseS==='learn'&&!isLearning(w.id)) return false;
      if(browseS==='known'&&!isKnown(w.id)) return false;
      if(browseS==='due'&&!isDue(w.id)) return false;
      if(!q) return true;
      return norm(w.w).includes(q)||norm(w.vi).includes(q)||norm(w.syn).includes(q);
    });
    const r=$('#res');r.innerHTML='';
    if(!list.length){r.innerHTML='<div class="empty"><span class="big">🕳️</span>Không tìm thấy từ nào.</div>';return;}
    r.appendChild(el('div','eyebrow','<div style="margin-bottom:8px">'+list.length+' từ</div>'));
    paginate(r,'browse',list,40,w=>{
      const cls=isNew(w.id)?'d-new':isKnown(w.id)?'d-known':'d-learn';
      const b=el('button','wrow');
      b.innerHTML=`<span class="ic">${w.pic}</span>
        <span style="min-width:0"><span class="w">${esc(w.w)}</span> <span class="ipa">${esc(w.ipa)}</span>
          ${w.cefr?`<span class="lvl ${w.cefr}" title="Trình độ Oxford 3000">${w.cefr}</span>`:''}
          <br><span class="m">${esc(w.vi)}</span></span>
        <span class="dot ${cls}" title="trạng thái"></span>`;
      b.onclick=()=>openDetail(w);
      return b;
    },{cls:'wlist',unit:'từ',top:r});
  };
  // đổi bộ lọc -> về trang 1
  $('#q').oninput=e=>{browseQ=e.target.value;PAGES.browse=0;draw();};
  $('#ft').onchange=e=>{browseT=e.target.value;PAGES.browse=0;draw();};
  $('#fs').onchange=e=>{browseS=e.target.value;PAGES.browse=0;draw();};
  $('#fo').onchange=e=>{browseO=e.target.value;PAGES.browse=0;draw();};
  draw();
}

// Danh sách giọng cho ô chọn: bỏ giọng trùng tên, chia nhóm "nghe tự nhiên" / "giọng khác"
function voiceOptions(sel){
  const vs=rankedVoices().filter((v,i,a)=>voiceScore(v)>0&&a.findIndex(x=>x.name===v.name&&x.lang===v.lang)===i);
  // "Microsoft Aria Online (Natural) - English (United States)" -> "Aria (Natural)"
  const nm=v=>String(v.name).replace(/^Microsoft\s+/,'').replace(/\s+Online\b/,'').replace(/\s+-\s+English.*$/,'');
  const o=v=>`<option value="${esc(v.voiceURI)}"${sel===v.voiceURI?' selected':''}>${esc(nm(v))} · ${esc(v.lang)} — ${esc(voiceTag(v))}</option>`;
  const hi=vs.filter(v=>voiceScore(v)>=50), lo=vs.filter(v=>voiceScore(v)<50);
  return (hi.length?`<optgroup label="Nghe tự nhiên">${hi.map(o).join('')}</optgroup>`:'')
    +(lo.length?`<optgroup label="Giọng khác">${lo.map(o).join('')}</optgroup>`:'');
}

const normEn=t=>String(t).toLowerCase().replace(/[’`]/g,"'").replace(/\s+/g,' ')
  .replace(/\s*([.,!?])\s*/g,'$1').replace(/[.!]+$/,'').trim();
const accepts=(ans,val)=>(Array.isArray(ans)?ans:[ans]).some(a=>normEn(a)===normEn(val));

function gstat(p){
  const pr=P[gid(p.id)];
  return {p, done:!!pr, due:!!(pr&&pr.d<=today()), known:!!(pr&&pr.i>=21),
          acc:pr&&pr.n?Math.round(pr.c/pr.n*100):null};
}
function grammarCounts(){
  let done=0,due=0,known=0;
  for(const pt of GPOINTS){const g=gstat(pt);if(g.done)done++;if(g.due)due++;if(g.known)known++;}
  return {done,due,known,total:GPOINTS.length};
}

function viewGrammar(root){
  const c=grammarCounts();
  const nEx=GPOINTS.reduce((n,p)=>n+p.ex.length,0);
  root.innerHTML=`<div class="page-h"><div><h1>Ngữ pháp</h1>
      <p>${GPOINTS.length} chuyên đề từ A1 đến C1 · ${nEx} bài tập. Mỗi chuyên đề có giải thích, bảng công thức, lỗi hay mắc và bài luyện.</p></div>
      <button class="btn btn-primary" id="gAll">${c.due?`Ôn ${c.due} chuyên đề tới hạn`:'Luyện ngẫu nhiên'}</button></div>
    <div class="stat-row">
      <div class="stat due"><b class="mono">${c.due}</b><span>Tới hạn ôn</span></div>
      <div class="stat"><b class="mono">${c.done}</b><span>Đã luyện</span></div>
      <div class="stat"><b class="mono">${c.known}</b><span>Đã vững</span></div>
      <div class="stat new"><b class="mono">${c.total-c.done}</b><span>Chưa học</span></div>
    </div>
    <div class="skillsw gtabs" id="gTabs" role="tablist" aria-label="Nhóm ngữ pháp">${GRAMMAR.map((g,i)=>
      `<button role="tab" data-g="${i}" aria-pressed="${i===(PAGES.grammar||0)}">${g.icon} ${esc(g.group)} <span class="mono">${g.points.length}</span></button>`).join('')}</div>
    <div id="gGroups"></div>`;
  const host=$('#gGroups');
  const gi=Math.min(PAGES.grammar||0,GRAMMAR.length-1);
  $('#gTabs').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ PAGES.grammar=+b.dataset.g; render(); });
  [GRAMMAR[gi]].forEach(g=>{
    const sec=el('div','gr-group');
    sec.innerHTML=`<h2><span>${g.icon}</span>${esc(g.group)}</h2><div class="gr-list"></div>`;
    const list=sec.querySelector('.gr-list');
    g.points.forEach(pt=>{
      const st=gstat(pt);
      const b=el('button','gr-item');
      const dot=st.known?'d-known':st.done?'d-learn':'d-new';
      b.innerHTML=`<div class="top"><span class="lvl ${pt.level}">${pt.level}</span>
          <span class="dot ${dot}" title="${st.known?'đã vững':st.done?'đang học':'chưa học'}"></span></div>
        <h3>${esc(pt.name)}</h3><div class="en">${esc(pt.en)}</div>
        ${st.acc!=null?`<div class="topic-meta">độ chính xác ${st.acc}%${st.due?' · <span style="color:var(--chalk)">tới hạn</span>':''}</div>`:''}`;
      b.onclick=()=>go('lesson',{gid:pt.id});
      list.appendChild(b);
    });
    host.appendChild(sec);
  });
  $('#gAll').onclick=()=>{
    const pool=GPOINTS.filter(pt=>{const g=gstat(pt);return g.due||!g.done;});
    startDrill(shuffle(pool.length?pool:[...GPOINTS]).slice(0,5).map(p=>p.id),true);
  };
}

/* ---------- phiên luyện ngữ pháp ---------- */
let DRILL=null;
function startDrill(ids,mixed){
  const q=[];
  ids.forEach(id=>{
    const pt=GP_BY_ID.get(id); if(!pt) return;
    const list=mixed?shuffle([...pt.ex]).slice(0,3):shuffle([...pt.ex]);
    list.forEach(e=>q.push({pt,e}));
  });
  if(!q.length){toast('Không có bài tập nào');return;}
  DRILL={queue:mixed?shuffle(q):q,i:0,right:0,byPoint:{},total:q.length,start:Date.now(),ids};
  ids.forEach(id=>DRILL.byPoint[id]={n:0,c:0});
  go('gdrill');
}
function renderDrill(){
  const root=$('#studyRoot'); if(!root) return;
  STUDY_SEQ++;
  if(!DRILL){go('grammar');return;}
  if(DRILL.i>=DRILL.queue.length){renderDrillDone(root);return;}
  const {pt,e}=DRILL.queue[DRILL.i];
  const pct=Math.round(DRILL.i/DRILL.total*100);
  const label={mc:'Chọn đáp án',fill:'Điền từ',order:'Sắp xếp câu',fix:'Sửa lỗi sai'}[e.t];
  root.innerHTML=`
    <div class="study-bar">
      <button class="btn btn-sm" id="quit" aria-label="Thoát">✕</button>
      <span class="bar" style="flex:1"><i class="b-known" style="width:${pct}%"></i></span>
      <span class="study-count">${DRILL.i+1}/${DRILL.total}</span>
    </div>
    <div style="display:flex;justify-content:center;gap:8px;margin-bottom:14px;flex-wrap:wrap">
      <span class="mode-tag">${label}</span><span class="chip">${esc(pt.name)}</span>
    </div>
    <div class="fc" id="cardHost"></div>`;
  $('#quit').onclick=()=>{ if(confirm('Kết thúc phiên luyện?')){DRILL=null;go('grammar');} };
  const host=$('#cardHost');
  ({mc:exMC,fill:exFill,order:exOrder,fix:exFix}[e.t])(host,pt,e);
}
function drillNext(pt,ok){
  DRILL.byPoint[pt.id].n++; if(ok){DRILL.byPoint[pt.id].c++;DRILL.right++;}
  DRILL.i++; renderDrill();
}
function drillFeedback(host,pt,e,ok,extra){
  const box=el('div');
  box.innerHTML=`<div class="feedback ${ok?'ok':'no'}">${ok?'Chính xác':'Chưa đúng'}</div>
    ${extra||''}<div class="why-box"><b>Vì sao</b>${esc(e.w)}</div>`;
  host.appendChild(box);
  const next=el('button','btn btn-primary btn-lg','Tiếp theo');
  next.style.cssText='width:100%;margin-top:14px';
  next.onclick=()=>drillNext(pt,ok);
  host.appendChild(next);
}
const gapHtml=t=>esc(t).replace(/___+/g,'<span class="gap">&nbsp;&nbsp;&nbsp;</span>');

function exMC(host,pt,e){
  host.innerHTML=`<div class="q-text">${gapHtml(e.q)}</div><div class="opts" id="o"></div><div id="after"></div>`;
  const ob=host.querySelector('#o');
  e.o.forEach((opt,i)=>{
    const b=el('button','opt',`<span class="n">${'ABCD'[i]}</span><span>${esc(opt)}</span>`);
    b.onclick=()=>{
      ob.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;
        if(j===e.a) x.classList.add('right'); else if(j===i) x.classList.add('wrong');});

const EXAM=DATA.exam||{};

function savePlan(){ lsSet(LS_PLAN,PLAN); clearTimeout(saveTimer); saveTimer=setTimeout(cloudPush,4000); }

const LEVEL_ORDER=['A1','A2','B1','B2','C1'];
const fmtDay=n=>{const d=new Date(n*DAY);return d.getDate()+'/'+(d.getMonth()+1);};

/* ---- xếp chuyên đề ngữ pháp theo trình độ cần cho mục tiêu ---- */
function grammarForTarget(examId,target){
  const X=EXAM[examId];
  const ratio=target/X.max;
  const cap=ratio<0.55?'B1':(ratio<0.8?'B2':'C1');
  const capIdx=LEVEL_ORDER.indexOf(cap);
  return GPOINTS.filter(p=>LEVEL_ORDER.indexOf(p.level)<=capIdx)
    .sort((a,b)=>LEVEL_ORDER.indexOf(a.level)-LEVEL_ORDER.indexOf(b.level)||a.id.localeCompare(b.id));
}

/* ---- sinh lộ trình ---- */
function buildPlan(cfg){
  const X=EXAM[cfg.exam];
  const weeks=cfg.weeks, mins=cfg.hours*60;
  // 55% thời gian cho từ vựng, 25% ngữ pháp, 20% kỹ năng thi
  const wordsPerWeek=Math.min(150,Math.max(15,Math.round(mins*0.55/3)));
  const gramPerWeek=Math.max(1,Math.round(mins*0.25/25));
  // topicOrder liệt kê mã nhóm; mỗi nhóm trải ra các bài của nó
  const topics=X.topicOrder.flatMap(id=>GROUP_BY_ID.has(id)?GROUP_BY_ID.get(id).lessons:[id]).filter(id=>TOPIC_BY_ID.has(id));
  const gram=grammarForTarget(cfg.exam,cfg.target);

  // hàng đợi từ vựng: từng chủ đề cắt thành các lát
  const vq=[];
  topics.forEach(id=>{
    const n=TOPIC_BY_ID.get(id).words.length;
    for(let i=0;i<n;i+=wordsPerWeek) vq.push({t:id,from:i,to:Math.min(n,i+wordsPerWeek)});
  });
  let vi=0, gi=0, si=0;
  const start=today();
  const weekList=[];
  for(let w=0;w<weeks;w++){
    const r=(w+1)/weeks;
    const phase=r<=0.3?0:(r<=0.6?1:(r<=0.85?2:3));
    const item={week:w+1,from:start+w*7,to:start+w*7+6,phase,vocab:[],grammar:[],skills:[],test:false};
    // từ vựng: lấp đầy hạn mức tuần
    let budget=wordsPerWeek;
    while(budget>0&&vi<vq.length){
      const s=vq[vi];
      const take=Math.min(budget,s.to-s.from);
      item.vocab.push({t:s.t,from:s.from,to:s.from+take});
      budget-=take;
      if(s.from+take>=s.to) vi++; else s.from+=take;
    }
    // ngữ pháp
    for(let k=0;k<gramPerWeek&&gi<gram.length;k++) item.grammar.push(gram[gi++].id);
    // kỹ năng thi: ưu tiên nhiệm vụ đúng giai đoạn
    const pool=X.skills.filter(s=>s.phase===phase);
    const nSkill=phase===3?2:1;
    for(let k=0;k<nSkill&&pool.length;k++) item.skills.push(pool[(si++)%pool.length]);
    item.test=(w+1===Math.round(weeks*0.55))||(w+1===weeks);
    weekList.push(item);
  }
  return {exam:cfg.exam,target:cfg.target,level:cfg.level,weeks,hours:cfg.hours,
          start,created:Date.now(),wordsPerWeek,gramPerWeek,weekList,done:{}};
}

function planProgress(){
  if(!PLAN) return {done:0,total:0,pct:0};
  let total=0,done=0;
  PLAN.weekList.forEach(w=>{
    const n=w.vocab.length+w.grammar.length+w.skills.length+(w.test?1:0);
    total+=n;
    for(let i=0;i<n;i++) if(PLAN.done[w.week+':'+i]) done++;
  });
  return {done,total,pct:total?Math.round(done/total*100):0};
}
function currentWeek(){
  if(!PLAN) return null;
  const d=today();
  return PLAN.weekList.find(w=>d>=w.from&&d<=w.to)||PLAN.weekList.find(w=>d<w.from)||PLAN.weekList[PLAN.weekList.length-1];
}

let QUIZ=null;
function startPlacement(){
  const want={A1:2,A2:2,B1:3,B2:2,C1:1};
  const qs=[];
  LEVEL_ORDER.forEach(lv=>{
    const pool=[];
    GPOINTS.filter(p=>p.level===lv).forEach(p=>p.ex.filter(e=>e.t==='mc').forEach(e=>pool.push({p,e})));
    shuffle(pool).slice(0,want[lv]).forEach(x=>qs.push(x));
  });
  QUIZ={qs,i:0,right:0,byLevel:{}};
  LEVEL_ORDER.forEach(l=>QUIZ.byLevel[l]={n:0,c:0});
  go('placement');
}
function viewPlacement(root){
  if(!QUIZ) { startPlacement(); return; }
  if(QUIZ.i>=QUIZ.qs.length) return placementResult(root);
  const {p,e}=QUIZ.qs[QUIZ.i];
  root.innerHTML=`<div class="page-h" style="margin-bottom:12px"><div><h1 style="font-size:22px">Kiểm tra trình độ</h1>
    <p>Câu ${QUIZ.i+1} / ${QUIZ.qs.length} · chọn đáp án đúng nhất</p></div>
    <button class="btn btn-sm" id="skip">Bỏ qua</button></div>
    <span class="bar" style="display:flex;margin-bottom:18px"><i class="b-known" style="width:${QUIZ.i/QUIZ.qs.length*100}%"></i></span>
    <div class="fc" style="min-height:auto"><div class="q-text">${gapHtml(e.q)}</div>
      <div class="opts" id="o"></div></div>`;
  $('#skip').onclick=()=>{QUIZ=null;go('plan');};
  const ob=$('#o');
  e.o.forEach((opt,i)=>{
    const b=el('button','opt',`<span class="n">${'ABCD'[i]}</span><span>${esc(opt)}</span>`);
    b.onclick=()=>{

function placementResult(root){

  root.innerHTML=`<div class="fc" style="min-height:auto;text-align:center;align-items:center">

    <p style="color:var(--muted);margin:8px 0 16px">Đúng ${s}/${n} câu ngữ pháp trải đều các trình độ</p>

/* ============================================================
   6. Phiên học
   ============================================================ */
let SES=null, STUDY_SEQ=0;
const SKILLS={flash:'◈ Thẻ',listen:'♪ Nghe',speak:'🎙 Nói',write:'✎ Viết'};

function startSession(topicId,skill){
  const pool=topicId?WORDS.filter(w=>w.t===topicId||w.g===topicId):WORDS;
  const due=pool.filter(w=>!isNew(w.id)&&isDue(w.id));
  const nw =pool.filter(w=> isNew(w.id));
  let items=[...shuffle(due).slice(0,S.goalRev), ...shuffle(nw).slice(0,S.goalNew)].map(w=>({w}));
  if(!items.length){
    const soon=pool.filter(w=>!isNew(w.id)).sort((a,b)=>P[a.id].d-P[b.id].d).slice(0,20);
    if(!soon.length){toast('Chủ đề này chưa có từ nào để học');return;}
    if(!confirm('Không còn từ nào tới hạn. Ôn sớm 20 từ gần hạn nhất?')) return;
    items=shuffle(soon).map(w=>({w}));
  }
  SES={queue:shuffle(items),done:0,total:items.length,correct:0,answered:0,
       topic:topicId,skill:skill||'auto',curMode:null,start:Date.now()};
  go('study');
}
function pickMode(w){
  if(S.mode!=='auto') return S.mode;
  const p=P[w.id];
  if(!p||p.r===0) return 'flash';
  return ['listen','write','speak','flash'][(p.r-1)%4];
}
function renderStudy(){
  const root=$('#studyRoot'); if(!root) return;
  STUDY_SEQ++;
  if(!SES){go('home');return;}
  if(!SES.queue.length){ return renderDone(root); }
  // chọn thẻ: thẻ hẹn giờ đã tới giờ trước, rồi thẻ mới/ôn, cuối cùng là thẻ hẹn giờ sớm nhất (ôn sớm)
  { const now=Date.now(), Q=SES.queue;
    let k=-1, best=Infinity;
    Q.forEach((x,j)=>{ if(x.at&&x.at<=now&&x.at<best){best=x.at;k=j;} });
    if(k<0) k=Q.findIndex(x=>!x.at);
    if(k<0){ best=Infinity; Q.forEach((x,j)=>{ if(x.at<best){best=x.at;k=j;} }); }
    if(k>0){ const [it]=Q.splice(k,1); Q.unshift(it); } }
  const item=SES.queue[0], w=item.w;
  const early=item.at&&item.at>Date.now()?Math.ceil((item.at-Date.now())/MIN):0;
  const mode = item.mode || (SES.skill!=='auto' ? SES.skill : pickMode(w));
  SES.curMode=mode;
  const pct=SES.total?Math.round(SES.done/SES.total*100):0;
  root.innerHTML=`
    <div class="study-bar">
      <button class="btn btn-sm" id="quit" aria-label="Kết thúc phiên">✕</button>
      <span class="bar" style="flex:1"><i class="b-known" style="width:${pct}%"></i></span>
      <span class="study-count">${SES.done}/${SES.total}</span>
    </div>
    ${(()=>{ const vp=voiceProblem(); return vp&&!SES.vHide?`<div class="voice-warn lv${vp.lvl}"><div><b>${vp.lvl>1?'⚠ Giọng đọc chưa chuẩn':'Giọng đọc có thể tốt hơn'}</b> — ${esc(vp.msg)}<br><span>${esc(voiceHelp())}</span></div><button class="btn btn-sm" id="vHide" aria-label="Ẩn thông báo">✕</button></div>`:''; })()}
    ${early?`<div class="early-note">Ôn sớm — thẻ này hẹn ${early} phút nữa, nhưng không còn thẻ nào khác</div>`:''}
    <div class="skillsw" id="sw" role="group" aria-label="Chọn kỹ năng luyện">
      <button data-sk="auto" aria-pressed="${SES.skill==='auto'}">Tự động</button>
      ${Object.keys(SKILLS).map(k=>`<button data-sk="${k}" aria-pressed="${SES.skill===k||(SES.skill==='auto'&&mode===k)}">${SKILLS[k]}</button>`).join('')}
    </div>
    <div id="cardHost"></div>`;
  $('#vHide')?.addEventListener('click',()=>{ SES.vHide=true; $('.voice-warn')?.remove(); });
  $('#quit').onclick=()=>{ if(confirm('Kết thúc phiên học?')){SES=null;go('home');} };
  $('#sw').querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{
    SES.skill=b.dataset.sk; delete item.mode; renderStudy();
  });
  ({flash:cardFlash,listen:cardListen,speak:cardSpeak,write:cardWrite}[mode])($('#cardHost'),w,mode);
}
function advance(w,q,skill){
  const wasNew=srsState(P[w.id])===0;
  const mode=SES.curMode;
  const p=grade(w.id,q,skill);
  SES.answered++; if(q>=3) SES.correct++;
  SES.queue.shift();
  // còn trong bước học (1 phút, 10 phút...) -> quay lại trong phiên khi tới giờ
  if(p.due){ SES.queue.push({w,at:p.due}); }
  else{
    SES.done++;
    // từ mới vừa học bằng thẻ → cho luyện viết lại ngay trong phiên (kênh vận động)
    if(wasNew && mode==='flash' && SES.skill==='auto' && S.mode==='auto'){
      SES.queue.splice(Math.min(SES.queue.length,3),0,{w,mode:'write'});
      SES.total++;
    }
  }
  renderStudy();
}
function gradeBar(host,w,skill,only){
  const g=el('div','grade');
  const defs=[[0,'Lại','g-again'],[3,'Khó','g-hard'],[4,'Tốt','g-good'],[5,'Dễ','g-easy']];
  defs.forEach(([q,label,cls])=>{
    if(only&&!only.includes(q)) return;
    const b=el('button',cls,`${label}<small>${nextLabel(w.id,q)}</small>`);
    b.onclick=()=>advance(w,q,skill);
    g.appendChild(b);
  });
  host.appendChild(g);
  return g;
}

/* ---- Luyện viết ---- */
async function cardWrite(host,w){
  const seq=STUDY_SEQ;
  const pic=await picBlock(w,false);
  const re=new RegExp('\\b'+w.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\w*\\b','i');
  // co hai cau vi du thi doi qua lai cho moi lan gap, de nhin tu trong nhieu ngu canh
  const useSecond=w.ex2&&re.test(w.ex2)&&Math.random()<0.5;
  const src=useSecond?w.ex2:w.ex, srcVi=useSecond?w.ex2vi:w.exvi;
  const blanked=src.replace(re,m=>'<span class="blank">'+'_'.repeat(Math.max(3,m.length))+'</span>');
  let tries=0,hinted=false,solved=false;
  const fc=el('div','fc');
  fc.innerHTML=`${pic}
    <div class="fc-vi" style="font-size:22px">${esc(w.vi)}</div>
    <div class="fc-sub"><span class="pos">${esc(w.pos)}</span><span class="ipa">${esc(w.ipa)}</span>
      <button class="speak-btn" id="sp" aria-label="Nghe phát âm">🔊</button></div>
    <div class="fc-ex" style="text-align:center;margin-top:16px">${blanked}<span class="vi">${esc(srcVi)}</span></div>
    <div style="margin-top:16px">
      <input class="write-in" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="gõ từ tiếng Anh…" aria-label="Gõ từ tiếng Anh">
      <div class="diff" id="diff"></div>
      <div class="feedback" id="fb"></div>
    </div>
    <div style="margin-top:auto;padding-top:14px;display:flex;gap:8px" id="act">
      <button class="btn" id="hint" style="flex:1">Gợi ý chữ cái</button>
      <button class="btn btn-primary" id="chk" style="flex:2">Kiểm tra</button>
    </div>`;
  if(seq!==STUDY_SEQ) return;
  host.appendChild(fc);
  const q=sel=>fc.querySelector(sel);
  const inp=q('#ans'); setTimeout(()=>inp.focus(),120);
  q('#sp').onclick=e=>speak(w.w,{btn:e.currentTarget});
  const showDiff=v=>{
    const t=w.w,out=[];
    for(let i=0;i<Math.max(t.length,v.length);i++){
      const a=v[i],b=t[i];
      if(a==null) out.push(`<span class="miss">·</span>`);
      else if(b!=null&&a.toLowerCase()===b.toLowerCase()) out.push(`<span class="ok">${esc(a)}</span>`);
      else out.push(`<span class="no">${esc(a)}</span>`);
    }
    q('#diff').innerHTML=out.join('');
  };
  const finish=ok=>{
    solved=true; inp.disabled=true; inp.classList.add(ok?'ok':'no');
    q('#diff').innerHTML=w.w.split('').map(c=>`<span class="ok">${esc(c)}</span>`).join('');
    q('#fb').className='feedback '+(ok?'ok':'no');
    q('#fb').textContent=ok?(hinted?'Đúng — nhưng có dùng gợi ý':'Chính xác!'):'Đáp án: '+w.w;
    speak(w.w);
    q('#act').innerHTML='';
    if(ok) gradeBar(q('#act'),w,'write',hinted||tries>1?[0,3,4]:[3,4,5]);
    else gradeBar(q('#act'),w,'write',[0,3]);
  };
  const check=()=>{
    if(solved) return;
    const v=inp.value.trim(); if(!v) return;
    tries++;
    if(norm(v)===norm(w.w)) return finish(true);
    showDiff(v);
    if(tries>=3) return finish(false);
    q('#fb').className='feedback no';
    q('#fb').textContent=`Chưa đúng — còn ${3-tries} lượt`;
  };
  q('#chk').onclick=check;
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();check();}};
  inp.oninput=()=>{if(!solved&&inp.value)showDiff(inp.value);};
  q('#hint').onclick=()=>{
    hinted=true;
    const n=Math.min(w.w.length-1,Math.max(1,Math.ceil(w.w.length/3)));
    inp.value=w.w.slice(0,n); inp.focus(); showDiff(inp.value);
    q('#fb').className='feedback'; q('#fb').textContent=`${w.w.length} chữ cái`;
  };
}

    try{

      rec.lang=S.dialect; rec.interimResults=false; rec.maxAlternatives=5;
      rec.onstart=()=>{running=true;mic.classList.add('rec');mic.textContent='■';q('#heard').textContent='Đang nghe…';};
      rec.onerror=ev=>{running=false;mic.classList.remove('rec');mic.textContent='🎙';
        fallback(ev.error==='not-allowed'||ev.error==='service-not-allowed'
          ?'Trang chưa được cấp quyền micro.':'Không nhận được âm thanh.');};
      rec.onend=()=>{running=false;mic.classList.remove('rec');mic.textContent='🎙';};
      rec.onresult=ev=>{
        const alts=[...ev.results[0]].map(r=>r.transcript);
        const hit=alts.some(a=>norm(a)===norm(w.w)||norm(a).split(' ').includes(norm(w.w)));
        q('#heard').innerHTML=`Nghe được: <b>“${esc(alts[0])}”</b>`;
        act.innerHTML='';
        if(hit){
          act.appendChild(el('div','feedback ok','Phát âm khớp 👏'));
          gradeBar(act,w,'speak',[3,4,5]);
        }else{
          act.appendChild(el('div','feedback no','Chưa khớp — nghe mẫu rồi thử lại'));
          gradeBar(act,w,'speak',[0,3,4]);
        }
      };
      rec.start();
    }catch(e){ fallback('Không khởi động được micro.'); }
  };
  function fallback(msg){
    zone.innerHTML=`<div style="text-align:center">
      <button class="speak-btn" id="big" style="width:86px;height:86px;font-size:34px;margin:0 auto">🔊</button>
      <p style="color:var(--muted);font-size:14px;margin:12px 0 0">${esc(msg)}<br>Nghe mẫu, đọc to theo, rồi tự chấm.</p></div>`;
    q('#big').onclick=e=>speak(w.w,{btn:e.currentTarget});
    act.innerHTML=''; gradeBar(act,w,'speak');
  }
}

   9. Hội thoại theo chủ đề — nguồn DailyDialog (CC BY-NC-SA 4.0)
   ============================================================ */
const DIALOGS=DATA.dialogs||{};          // {groupId:[{id,title,words[],en[],vi[]}]}
const dlgGroupOf=id=>{ if(!id) return ''; const g=TOPIC_BY_ID.has(id)?TOPIC_BY_ID.get(id).group:id; return DIALOGS[g]&&DIALOGS[g].length?g:''; };
const LS_D='bnt.dlg.v1';
let DLGP=lsGet(LS_D,{});                 // {dialogId:{v:1 đã đọc, r:% đóng vai tốt nhất, f:% điền từ tốt nhất}}
function saveD(){lsSet(LS_D,DLGP);}
const DLG={mode:'read',role:1,vi:false,peek:false};
const DLGPLAY={tok:0}; let DLGSEQ=0;
const DLG_SRC='Hội thoại lấy nguyên văn từ kho <b>DailyDialog</b> (Li và cộng sự, IJCNLP 2017), '+
  'giấy phép CC BY-NC-SA 4.0 — chỉ dùng phi thương mại. Câu tiếng Anh chỉ chuẩn hoá dấu câu; '+
  'bản dịch tiếng Việt do app biên dịch.';

// Bản đồ dạng viết -> mục từ của chủ đề (gồm cả dạng số nhiều, quá khứ, so sánh...)
const FORM_MAPS=new Map();
function formMap(tid){
  if(FORM_MAPS.has(tid)) return FORM_MAPS.get(tid);
  const m=new Map();
  const add=(f,w,strong)=>{f=String(f).toLowerCase().trim(); if(f&&(strong||!m.has(f))) m.set(f,w);};
  for(const w of WORDS){
    if(w.g!==tid&&w.t!==tid) continue;
    const b=w.w.toLowerCase();
    add(b,w,true);
    String(w.forms||'').split(/[·,\/;]/).forEach(x=>{
      x=x.replace(/\(.*?\)/g,'').trim();
      if(/^[a-z][a-z'-]*$/i.test(x)&&!/^(more|most|less|least)$/i.test(x)) add(x,w);});   // "more · most" không phải dạng của từ
    const d=b+b.slice(-1);
    [b+'s',b+'es',b+'ed',b+'d',b+'ing',b+'er',b+'r',b+'est',b+'st',d+'er',d+'est',d+'ed',d+'ing',
     b.replace(/e$/,'ing'),b.replace(/y$/,'ies'),b.replace(/y$/,'ier'),b.replace(/y$/,'iest')].forEach(x=>add(x,w));
    if(/e$/.test(b)&&b.length>=6) add(b.slice(0,-1),w);   // blonde -> blond
  }
  FORM_MAPS.set(tid,m); return m;
}
// Tách câu thành đoạn chữ thường / đoạn là từ của chủ đề.
// allow: tập từ đã duyệt là dùng đúng nghĩa trong đoạn này (d.words) — từ khác nghĩa không tô.
function dlgTokens(text,tid,allow){
  const m=formMap(tid), out=[], re=/[A-Za-z]+(?:[-'][A-Za-z]+)*/g;
  const look=t=>{ const w=m.get(t.toLowerCase()); return w&&(!allow||allow.has(w.w.toLowerCase()))?w:null; };
  let last=0,x;
  const hit=(s,at,w)=>{ if(at>last) out.push({s:text.slice(last,at)}); out.push({s,w}); last=at+s.length; };
  while((x=re.exec(text))){
    const tok=x[0].replace(/'s$/i,''), at=x.index;
    const w=look(tok);
    if(w){ hit(tok,at,w); continue; }
    if(tok.includes('-')){
      let off=at;
      for(const part of tok.split('-')){ const pw=look(part); if(pw) hit(part,off,pw); off+=part.length+1; }
    }
  }
  if(last<text.length) out.push({s:text.slice(last)});
  return out;
}
const dlgAllow=d=>d.words&&d.words.length?new Set(d.words):null;
// Từ mới của mỗi đoạn = từ chưa xuất hiện ở các đoạn đứng trước trong danh sách
const DLG_NEW=new Map();
function dlgNew(tid,d){
  if(!DLG_NEW.has(tid)){
    const seen=new Set(), map=new Map();
    (DIALOGS[tid]||[]).forEach(x=>{
      const ws=dlgWords(x,tid).map(w=>w.w.toLowerCase()).filter(w=>!seen.has(w));
      ws.forEach(w=>seen.add(w)); map.set(x.id,new Set(ws));
    });
    DLG_NEW.set(tid,map);
  }
  return DLG_NEW.get(tid).get(d.id)||new Set();
}
const dlgLineHtml=(text,tid,d)=>{
  const nw=d?dlgNew(tid,d):new Set();
  return dlgTokens(text,tid,d&&dlgAllow(d)).map(t=>t.w
    ?`<button class="dw${nw.has(t.w.w.toLowerCase())?' new':''}" data-w="${esc(t.w.id)}">${esc(t.s)}</button>`:esc(t.s)).join('');
};
function dlgWords(d,tid){
  const seen=new Map(), allow=dlgAllow(d);
  d.en.forEach(s=>dlgTokens(s,tid,allow).forEach(t=>{ if(t.w&&!seen.has(t.w.id)) seen.set(t.w.id,t.w); }));
  return [...seen.values()];
}
function dlgTopicCover(tid){
  const ids=new Set(); (DIALOGS[tid]||[]).forEach(d=>dlgWords(d,tid).forEach(w=>ids.add(w.id)));
  return ids.size;
}

/* ---- giọng đọc: hai người nói dùng hai giọng khác nhau ---- */
// Đoán giới tính giọng qua tên (để hai người nói dễ phân biệt)
const FEMALE=/female|woman|aria|jenny|zira|samantha|libby|sonia|ava|emma|michelle|ana|susan|hazel|karen|moira|tessa|fiona|victoria|allison|serena|kate|salli|joanna|ivy|kimberly|clara|natasha|maisie|sara|jane|nancy/i;
const MALE=/\bmale|\bman\b|guy|david|mark|ryan|christopher|eric|daniel|alex|tom|fred|george|james|brian|roger|steffan|andrew|brandon|davis|jason|tony|thomas|william|oliver|arthur|matthew|justin|joey|liam/i;
const voiceSex=v=>{ const n=v.name||''; return FEMALE.test(n)?'f':MALE.test(n)?'m':''; };
// Giọng B: chỉ lấy giọng chất lượng cao (Natural/Google...), ưu tiên khác giới với A.
// Không có giọng tốt thứ hai -> dùng lại giọng A ở tông bình thường (không hạ tông làm méo tiếng).
function dlgVoices(){
  const a=pickVoice();
  if(S.voiceB){ const v=TTS.voices.find(x=>x.voiceURI===S.voiceB); if(v) return [a,v]; }
  if(!a){
    if(!useSystemVoice()) return [null,null];
    // A = giọng mặc định của máy (vd Allison Nâng cao); B = giọng Apple có sẵn, ưu tiên giọng nam để dễ phân biệt
    const good=rankedVoices().filter(v=>voiceScore(v)>0&&APPLE_GOOD.test(v.name||'')&&/^en/i.test(v.lang||''));
    return [null, good.find(v=>voiceSex(v)==='m')||good[0]||null];
  }
  const sa=voiceSex(a);
  // giọng tốt (Natural/Google, hoặc giọng người thật của Apple), khác người với giọng A (Samantha ≠ Samantha Nâng cao)
  const base=v=>String(v.name).replace(/\s*\(.*\)\s*$/,'').toLowerCase();
  const good=rankedVoices().filter(v=>v!==a&&base(v)!==base(a)&&(voiceScore(v)>=50||(voiceScore(v)>0&&APPLE_GOOD.test(v.name||''))));
  const pick=good.find(v=>sa&&voiceSex(v)&&voiceSex(v)!==sa)||good[0];
  return [a,pick||a];
}
function dlgSay(d,k,opts={}){
  const [va,vb]=dlgVoices();
  speak(d.en[k],{voice:k%2?vb:va,btn:opts.btn,onend:opts.onend});
}
function dlgVoiceNote(){
  const [va,vb]=dlgVoices();
  const nm=v=>esc(String(v.name).replace(/^(Microsoft|Google)\s+/,'').replace(/\s*Online.*$|\s*\(Natural\).*$/,''));
  if(!va) return vb?`Giọng A: <b>mặc định của ${isIOS()?'iPhone':'máy'}</b> · Giọng B: <b>${nm(vb)}</b>`:'';
  return va===vb?`Giọng đọc: <b>${nm(va)}</b> cho cả hai người (máy chưa có giọng tốt thứ hai)`
    :`Giọng A: <b>${nm(va)}</b> · Giọng B: <b>${nm(vb)}</b>`;
}
function dlgStop(){

}

function dlgRead(host,d,tid){
  const words=dlgWords(d,tid), nw=dlgNew(tid,d);

  host.innerHTML=`<div class="dlg-tools">

    <div class="dlg-lines">${d.en.map((s,k)=>dlgBubble(d,k,

    ${fresh.length?`<h3 class="dlg-h3"><span class="dw new">Từ mới</span> trong đoạn này (${fresh.length})</h3>
    <div class="dlg-words">${chips(fresh)}</div>`:''}
    ${again.length?`<h3 class="dlg-h3"><span class="dw">Ôn lại</span> từ đã gặp ở đoạn trước (${again.length})</h3>
    <div class="dlg-words">${chips(again)}</div>`:''}`;

    dlgStop(); stopUi(); dlgSay(d,+b.dataset.k,{btn:e.currentTarget});
  });
  host.querySelectorAll('.dl-bub').forEach(b=>b.onclick=e=>{ if(e.target.closest('[data-w]')) return; const v=b.querySelector('.dl-vi'); v.hidden=!v.hidden; });

/* ---- chế độ 2: đóng vai (nói phần của mình vào micro) ---- */
const sayWords=s=>norm(String(s).replace(/[-–—]/g,' ')).split(' ').filter(Boolean);
function sayScore(target,alts){
  const tw=sayWords(target); let best={s:-1,hit:[]};
  for(const a of alts){
    const bag=new Map(); sayWords(a).forEach(x=>bag.set(x,(bag.get(x)||0)+1));
    const hit=tw.map(x=>{const n=bag.get(x)||0; if(n){bag.set(x,n-1);return true;} return false;});
    const s=Math.round(hit.filter(Boolean).length/Math.max(1,tw.length)*100);
    if(s>best.s) best={s,hit};
  }
  return best;
}
// Tô xanh từ đã nói đúng, đỏ từ bị thiếu
function sayDiffHtml(target,hit){
  let i=0;
  return target.split(/(\s+)/).map(piece=>{
    if(/^\s*$/.test(piece)) return piece;
    const n=sayWords(piece).length; if(!n) return esc(piece);
    const ok=hit.slice(i,i+n).every(Boolean); i+=n;
    return `<span class="${ok?'ok':'miss'}">${esc(piece)}</span>`;
  }).join('');
}
function dlgRole(host,d,tid){
